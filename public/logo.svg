<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="#0f0f1a"/>
  <g transform="translate(256,256)">
    <!-- Calculator outline -->
    <rect x="-70" y="-80" width="140" height="160" rx="18" fill="none" stroke="url(#g)" stroke-width="14"/>
    <!-- Screen -->
    <rect x="-52" y="-62" width="104" height="40" rx="8" fill="url(#g)" opacity="0.9"/>
    <!-- Buttons row 1 -->
    <circle cx="-36" cy="4" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <circle cx="0" cy="4" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <circle cx="36" cy="4" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <!-- Buttons row 2 -->
    <circle cx="-36" cy="34" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <circle cx="0" cy="34" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <circle cx="36" cy="34" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <!-- Buttons row 3 -->
    <circle cx="-36" cy="64" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <circle cx="0" cy="64" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <circle cx="36" cy="64" r="10" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.6"/>
    <!-- Dollar sign -->
    <text x="-24" y="-38" font-family="Arial,sans-serif" font-weight="bold" font-size="22" fill="#0f0f1a" text-anchor="middle" dominant-baseline="middle">$</text>
  </g>
</svg>
